[project]
name = "reticulum-beacon"
version = "1.0.0"
description = "Personal Reticulum transport node and service hub — one command to join the mesh"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "synthalorian" },
]
requires-python = ">=3.10"
dependencies = [
    "rns>=1.3.0",
    "lxmf>=0.5.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",  # TLS certificate generation
    "jinja2>=3.1.0",  # Web UI templates
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-requests",
    "httpx",  # For TestClient in integration tests
    "python-multipart",  # For form data support
]

[project.urls]
homepage = "https://github.com/synthalorian/reticulum-beacon"
repository = "https://github.com/synthalorian/reticulum-beacon"

[project.scripts]
beacon = "reticulum_beacon.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "C4", "PL", "RUF"]
ignore = [
    "E501",  # Line length — covered by formatter
    "PLC0415",  # Import outside top-level — needed for circular dep avoidance
    "PLR0913",  # Too many arguments
    "PLR0914",  # Too many local variables
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value comparison
    "SIM114",   # Combine nested ifs
    "SIM115",   # Use context handler for open
    "RUF012",   # Mutable class defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "PLR0913", "S101", "N802", "N803", "N806", "PLR0915", "PLR0914"]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = ["RNS", "LXMF", "prometheus_client"]
ignore_missing_imports = true
