{% extends "base.html" %}
{% block title %}Interfaces — Reticulum Beacon{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-slate-100 mb-6">📡 Interfaces</h1>

  <div class="card">
    <div class="card-header">
      <h2 class="text-lg font-semibold text-slate-100">Active Interfaces</h2>
    </div>
    <div class="card-body" id="interface-list" hx-get="/api/v1/web/interfaces" hx-trigger="load, every 10s" hx-swap="innerHTML">
      <div class="text-center py-8 text-slate-500">Loading interfaces...</div>
    </div>
  </div>

  <div class="card mt-6">
    <div class="card-header">
      <h2 class="text-lg font-semibold text-slate-100">Discovered Peers</h2>
    </div>
    <div class="card-body" id="peer-list" hx-get="/api/v1/web/peers" hx-trigger="load, every 15s" hx-swap="innerHTML">
      <div class="text-center py-8 text-slate-500">Loading peers...</div>
    </div>
  </div>
</div>
{% endblock %}
